[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eggswap"
version = "0.1.0"
description = "One local, single-owner, multi-account plane that rotates both Claude and Codex accounts behind one honest interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vadim Surin" }]
keywords = ["claude", "codex", "cli", "quota", "accounts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Tools",
    "Topic :: Utilities",
]
# Hard constraint: eggswap ships zero runtime dependencies. Anything an
# account-availability decision touches must be auditable stdlib, not a
# transitive package that could silently change what "available" means.
dependencies = []

[project.urls]
Homepage = "https://github.com/whipstack/eggswap"
Issues = "https://github.com/whipstack/eggswap/issues"

[project.scripts]
eggswap = "eggswap.cli:main_entry"

[tool.setuptools.packages.find]
include = ["eggswap*"]
