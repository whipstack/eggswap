name: Eggswap CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the stdlib test suite
        run: python -m unittest discover -s tests -p 'test_eggswap*'

      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel

      - name: Install wheel and check the CLI entry point
        run: |
          python -m pip install --no-deps dist/eggswap-*.whl
          eggswap --help
